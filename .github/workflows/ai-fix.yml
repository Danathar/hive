name: AI Fix with Copilot

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to assign to Copilot
        required: true
        type: string
  issues:
    types: [labeled]
  pull_request:
    types: [opened]

permissions:
  issues: write

jobs:
  ai-fix:
    # SECURITY: pin the cross-repo reusable workflow to an immutable commit SHA,
    # not the mutable @main. This workflow runs on pull_request_target (which has
    # write permissions + secret access), so a mutable ref means anyone who can
    # push to kubestellar/infra's main could alter what runs here with our token.
    # Bump this SHA deliberately when adopting a reviewed change to the reusable
    # workflow. (SHA corresponds to kubestellar/infra main as of the pin; advanced
    # to the v2 #3088 pin — reduced permissions + pull_request trigger.)
    uses: kubestellar/infra/.github/workflows/reusable-ai-fix.yml@50f6dd45dad477e9815b557b40649c68942f8159
    with:
      issue_number: ${{ github.event.inputs.issue_number || '' }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
